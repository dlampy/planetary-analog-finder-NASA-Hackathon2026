<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>NASA Space Apps 2026 · 3D Earth, Moon & Mars</title>
  <style>
    :root {
      --bg-space: #030712;
      --panel-bg: rgba(10, 15, 30, 0.8);
      --panel-border: rgba(148, 163, 184, 0.22);
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --accent-earth: #38bdf8;
      --accent-moon: #e2e8f0;
      --accent-mars: #fb7185;
      --active-accent: #38bdf8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
      background: radial-gradient(circle at 50% 45%, #0b132b 0%, #030712 75%);
      color: var(--text-main);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      user-select: none;
    }

    #canvas-container {
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* Top Bar */
    .top-bar {
      position: fixed;
      top: 18px;
      left: 22px;
      right: 22px;
      z-index: 10;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      pointer-events: none;
    }

    .brand {
      pointer-events: auto;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 16px;
      padding: 13px 18px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.45);
    }

    .brand-badge {
      display: inline-block;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 4px;
    }

    .brand h1 {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .brand p {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 3px;
    }

    .controls-bar {
      pointer-events: auto;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .ctrl-btn {
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      padding: 9px 13px;
      border-radius: 12px;
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .ctrl-btn:hover {
      border-color: rgba(255, 255, 255, 0.45);
      transform: translateY(-1px);
    }

    .ctrl-btn.active {
      border-color: var(--active-accent);
      background: rgba(56, 189, 248, 0.16);
    }

    /* Info Panel */
    .info-panel {
      position: fixed;
      top: 108px;
      left: 22px;
      z-index: 10;
      width: 315px;
      max-height: calc(100vh - 235px);
      overflow-y: auto;
      background: var(--panel-bg);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--panel-border);
      border-radius: 18px;
      padding: 16px 18px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
    }

    .info-panel::-webkit-scrollbar {
      width: 5px;
    }
    .info-panel::-webkit-scrollbar-thumb {
      background: rgba(148, 163, 184, 0.3);
      border-radius: 99px;
    }

    .info-tag {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: var(--active-accent);
      margin-bottom: 5px;
    }

    .info-panel h2 {
      font-size: 21px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .info-desc {
      font-size: 12.5px;
      line-height: 1.55;
      color: #cbd5e1;
      margin-bottom: 12px;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 11px;
    }

    .stat-item {
      background: rgba(255, 255, 255, 0.035);
      padding: 7px 9px;
      border-radius: 10px;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      display: block;
    }

    .stat-value {
      font-size: 12.5px;
      font-weight: 700;
      margin-top: 2px;
      display: block;
    }

    /* Analog Sites List */
    .analogs-section {
      margin-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.08);
      padding-top: 10px;
    }

    .analogs-title {
      font-size: 10.5px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--text-muted);
      margin-bottom: 7px;
    }

    .analog-item {
      width: 100%;
      text-align: left;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 10px;
      padding: 7px 9px;
      margin-bottom: 6px;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .analog-item:hover,
    .analog-item.selected {
      background: rgba(56, 189, 248, 0.14);
      border-color: var(--active-accent);
    }

    .analog-name {
      font-size: 12px;
      font-weight: 700;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 6px;
    }

    .analog-coords {
      font-size: 10px;
      font-weight: 600;
      color: var(--active-accent);
    }

    .analog-note {
      font-size: 11px;
      color: #cbd5e1;
      margin-top: 3px;
      line-height: 1.4;
    }

    .texture-status {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 10px;
      font-size: 11px;
      line-height: 1.45;
      border: 1px solid rgba(148, 163, 184, 0.2);
      background: rgba(15, 23, 42, 0.65);
      color: #cbd5e1;
    }

    .texture-status.real {
      border-color: rgba(52, 211, 153, 0.4);
      background: rgba(16, 185, 129, 0.12);
      color: #a7f3d0;
    }

    .texture-status.fallback {
      border-color: rgba(251, 191, 36, 0.35);
      background: rgba(245, 158, 11, 0.1);
      color: #fde68a;
    }

    .local-upload-btn {
      margin-top: 8px;
      width: 100%;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1px dashed rgba(56, 189, 248, 0.5);
      background: rgba(56, 189, 248, 0.1);
      color: #e0f2fe;
      font-size: 11.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .local-upload-btn:hover {
      background: rgba(56, 189, 248, 0.22);
      border-color: #38bdf8;
    }

    /* 3 Planet Selector Boxes */
    .selector-dock {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      display: grid;
      grid-template-columns: repeat(3, minmax(175px, 220px));
      gap: 12px;
      padding: 10px;
      background: rgba(8, 13, 26, 0.7);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1px solid var(--panel-border);
      border-radius: 22px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
    }

    .planet-card {
      position: relative;
      background: rgba(255, 255, 255, 0.03);
      border: 1.5px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 13px 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 12px;
      text-align: left;
      color: var(--text-main);
      transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .planet-card:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.25);
      transform: translateY(-3px);
    }

    .planet-card.active[data-planet="earth"] {
      border-color: var(--accent-earth);
      background: linear-gradient(135deg, rgba(56, 189, 248, 0.22), rgba(15, 23, 42, 0.78));
      box-shadow: 0 0 24px rgba(56, 189, 248, 0.28);
    }

    .planet-card.active[data-planet="moon"] {
      border-color: var(--accent-moon);
      background: linear-gradient(135deg, rgba(226, 232, 240, 0.2), rgba(15, 23, 42, 0.78));
      box-shadow: 0 0 24px rgba(226, 232, 240, 0.22);
    }

    .planet-card.active[data-planet="mars"] {
      border-color: var(--accent-mars);
      background: linear-gradient(135deg, rgba(249, 115, 22, 0.25), rgba(15, 23, 42, 0.78));
      box-shadow: 0 0 24px rgba(249, 115, 22, 0.3);
    }

    .orb-preview {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      flex-shrink: 0;
      box-shadow: inset -8px -8px 14px rgba(0, 0, 0, 0.65);
    }

    .orb-earth {
      background: radial-gradient(circle at 30% 30%, #60a5fa, #1d4ed8 55%, #065f46 75%, #0f172a);
      box-shadow: inset -8px -8px 14px rgba(0, 0, 0, 0.65), 0 0 12px rgba(56, 189, 248, 0.45);
    }

    .orb-moon {
      background: radial-gradient(circle at 32% 30%, #f1f5f9, #94a3b8 55%, #475569 90%);
      box-shadow: inset -8px -8px 14px rgba(0, 0, 0, 0.7), 0 0 10px rgba(226, 232, 240, 0.3);
    }

    .orb-mars {
      background: radial-gradient(circle at 30% 30%, #fdba74, #ea580c 52%, #7c2d12 90%);
      box-shadow: inset -8px -8px 14px rgba(0, 0, 0, 0.65), 0 0 12px rgba(249, 115, 22, 0.45);
    }

    .card-text .title {
      font-size: 15px;
      font-weight: 700;
      display: block;
    }

    .card-text .sub {
      font-size: 11px;
      color: var(--text-muted);
      display: block;
      margin-top: 2px;
    }

    .key-hint {
      position: absolute;
      top: 8px;
      right: 10px;
      font-size: 10px;
      font-weight: 700;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 6px;
      border-radius: 6px;
    }

    /* Tooltip on 3D Marker Hover */
    #marker-tooltip {
      position: fixed;
      z-index: 20;
      pointer-events: none;
      background: rgba(8, 13, 26, 0.92);
      border: 1px solid rgba(56, 189, 248, 0.5);
      border-radius: 10px;
      padding: 7px 10px;
      font-size: 12px;
      color: #f8fafc;
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.55);
      display: none;
      max-width: 220px;
    }

    /* Loading / Status Overlay */
    #status-overlay {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #030712;
      color: #e2e8f0;
      gap: 12px;
      transition: opacity 0.35s ease;
    }

    #status-overlay.hidden {
      opacity: 0;
      pointer-events: none;
    }

    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    @media (max-width: 860px) {
      .info-panel {
        display: none;
      }
      .selector-dock {
        width: calc(100vw - 20px);
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
        padding: 8px;
        bottom: 12px;
      }
      .planet-card {
        flex-direction: column;
        text-align: center;
        padding: 10px 6px;
        gap: 7px;
      }
      .key-hint {
        display: none;
      }
      .top-bar {
        top: 10px;
        left: 10px;
        right: 10px;
        flex-direction: column;
      }
    }
  </style>
</head>
<body>
  <div id="status-overlay">
    <div class="spinner"></div>
    <div id="status-text">Đang tải dữ liệu bản đồ 3D...</div>
  </div>

  <div id="canvas-container"></div>
  <div id="marker-tooltip"></div>

  <header class="top-bar">
    <div class="brand">
      <span class="brand-badge">NASA Space Apps 2026 · 3D Explorer</span>
      <h1>Mô hình 3D Trái Đất, Mặt Trăng &amp; Sao Hỏa</h1>
      <p>Kéo để xoay · Cuộn để zoom · Click 3 ô bên dưới (hoặc phím 1, 2, 3) để đổi hành tinh</p>
    </div>

    <div class="controls-bar">
      <button class="ctrl-btn active" id="btn-autorotate">⟳ Tự xoay</button>
      <button class="ctrl-btn active" id="btn-markers">📍 Điểm Analog</button>
      <button class="ctrl-btn" id="btn-wireframe">▦ Lưới 3D</button>
      <button class="ctrl-btn" id="btn-reset">⌖ Đặt lại góc nhìn</button>
    </div>
  </header>

  <aside class="info-panel" id="info-panel">
    <div class="info-tag" id="info-tag"></div>
    <h2 id="info-title">Trái Đất</h2>
    <p class="info-desc" id="info-desc"></p>
    <div class="stats-grid" id="stats-grid"></div>

    <div class="analogs-section">
      <div class="analogs-title" id="analogs-title">Địa điểm trọng tâm</div>
      <div id="analogs-list"></div>
    </div>

    <div class="texture-status" id="texture-status">Đang kiểm tra dữ liệu bản đồ...</div>
    <button class="local-upload-btn" id="btn-pick-texture" type="button">📂 Chọn ảnh bản đồ từ máy</button>
    <input type="file" id="local-texture-input" accept="image/*" hidden />
  </aside>

  <nav class="selector-dock" aria-label="Chọn mô hình hành tinh 3D">
    <button class="planet-card active" data-planet="earth" id="card-earth">
      <span class="key-hint">1</span>
      <span class="orb-preview orb-earth"></span>
      <span class="card-text">
        <span class="title">Trái Đất</span>
        <span class="sub">Earth · Analog Base</span>
      </span>
    </button>

    <button class="planet-card" data-planet="moon" id="card-moon">
      <span class="key-hint">2</span>
      <span class="orb-preview orb-moon"></span>
      <span class="card-text">
        <span class="title">Mặt Trăng</span>
        <span class="sub">Moon · Lunar Base</span>
      </span>
    </button>

    <button class="planet-card" data-planet="mars" id="card-mars">
      <span class="key-hint">3</span>
      <span class="orb-preview orb-mars"></span>
      <span class="card-text">
        <span class="title">Sao Hỏa</span>
        <span class="sub">Mars · Red Planet</span>
      </span>
    </button>
  </nav>

  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <script>
    (function () {
      const overlay = document.getElementById('status-overlay');
      const statusText = document.getElementById('status-text');

      if (typeof THREE === 'undefined') {
        statusText.textContent = 'Không thể tải thư viện Three.js. Vui lòng kiểm tra kết nối Internet.';

      // ==========================================

        }
      };

      // ==========================================
      // 2. KHỞI TẠO CẢNH THREE.JS & ÁNH SÁNG
      // ==========================================
      const container = document.getElementById('canvas-container');
      const scene = new THREE.Scene();

      const camera = new THREE.PerspectiveCamera(42, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 0.8, 5.4);

      let renderer;
      try {
        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.outputEncoding = THREE.sRGBEncoding;
        container.appendChild(renderer.domElement);
      } catch (err) {
        statusText.textContent = 'Thiết bị chưa bật WebGL để hiển thị 3D: ' + (err && err.message ? err.message : err);
        return;
      }

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.06;
      controls.minDistance = 2.6;
      controls.maxDistance = 12;
      controls.enablePan = false;
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.85;

      const sunLight = new THREE.DirectionalLight(0xffffff, 1.55);
      sunLight.position.set(6, 3, 5);
      scene.add(sunLight);

      const rimLight = new THREE.DirectionalLight(0x38bdf8, 0.25);
      rimLight.position.set(-6, -2, -5);
      scene.add(rimLight);

      scene.add(new THREE.AmbientLight(0x475569, 0.65));

      // Nền sao 3D
      (function createStarfield() {
        const starGeo = new THREE.BufferGeometry();
        const count = 2400;
        const pos = new Float32Array(count * 3);
        const col = new Float32Array(count * 3);
        for (let i = 0; i < count; i++) {
          const r = 45 + Math.random() * 80;
          const theta = Math.random() * Math.PI * 2;
          const phi = Math.acos(2 * Math.random() - 1);
          pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
          pos[i * 3 + 1] = r * Math.cos(phi);
          pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
          const t = 0.75 + Math.random() * 0.25;
          col[i * 3] = t;
          col[i * 3 + 1] = t;
          col[i * 3 + 2] = Math.min(1, t + 0.12);
        }
        starGeo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        starGeo.setAttribute('color', new THREE.BufferAttribute(col, 3));
        const starField = new THREE.Points(starGeo, new THREE.PointsMaterial({
          size: 0.22,
          vertexColors: true,
          transparent: true,
          opacity: 0.85
        }));
        starField.name = 'starfield';
        scene.add(starField);
      })();

      // ==========================================
      // 3. TIỆN ÍCH NẠP TEXTURE & TỌA ĐỘ CẦU
      // ==========================================
      const textureLoader = new THREE.TextureLoader();

      function loadSingleTexture(url, isColor) {
        return new Promise((resolve) => {
          textureLoader.load(
            url,
            (tex) => {
              if (isColor) tex.encoding = THREE.sRGBEncoding;
              tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
              tex.userData = { url };
              resolve(tex);
            },
            undefined,
            () => resolve(null)
          );
        });
      }

      async function loadFirstAvailable(fileNames, isColor = true) {
        if (!fileNames || !fileNames.length || window.location.protocol === 'file:') return null;
        for (const name of fileNames) {
          const tex = await loadSingleTexture('./assets/textures/' + name, isColor);
          if (tex) return tex;
        }
        return null;
      }

      function createAtmosphereMesh(radius, colorHex, intensity) {
        const geo = new THREE.SphereGeometry(radius, 64, 64);
        const mat = new THREE.ShaderMaterial({
          uniforms: {
            glowColor: { value: new THREE.Color(colorHex) },
            intensity: { value: intensity }
          },
          vertexShader: `
            varying vec3 vNormal;
            void main() {
              vNormal = normalize(normalMatrix * normal);
              gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
            }
          `,
          fragmentShader: `
            uniform vec3 glowColor;
            uniform float intensity;
            varying vec3 vNormal;
            void main() {
              float fresnel = pow(0.68 - dot(vNormal, vec3(0.0, 0.0, 1.0)), 3.2);
              gl_FragColor = vec4(glowColor, 1.0) * clamp(fresnel, 0.0, 1.0) * intensity;
            }
          `,
          side: THREE.BackSide,
          blending: THREE.AdditiveBlending,
          transparent: true,
          depthWrite: false
        });
        return new THREE.Mesh(geo, mat);
      }

      function latLonToVector3(lat, lon, radius) {
        const phi = THREE.MathUtils.degToRad(90 - lat);
        const theta = THREE.MathUtils.degToRad(lon + 180);
        return new THREE.Vector3(
          -radius * Math.sin(phi) * Math.cos(theta),
          radius * Math.cos(phi),
          radius * Math.sin(phi) * Math.sin(theta)
        );
      }

      function createAnalogMarkers(cfg) {
        const markersGroup = new THREE.Group();
        markersGroup.name = 'markers';

        const dotGeo = new THREE.SphereGeometry(0.032, 16, 16);
        const ringGeo = new THREE.RingGeometry(0.042, 0.06, 24);

        cfg.analogs.forEach((site, index) => {
          const pos = latLonToVector3(site.lat, site.lon, RADIUS + 0.015);
          const dotMat = new THREE.MeshBasicMaterial({ color: cfg.markerColor });
          const dot = new THREE.Mesh(dotGeo, dotMat);
          dot.position.copy(pos);
          dot.userData = { site, index };

          const ringMat = new THREE.MeshBasicMaterial({
            color: cfg.markerColor,
            side: THREE.DoubleSide,
            transparent: true,
            opacity: 0.75
          });
          const ring = new THREE.Mesh(ringGeo, ringMat);
          ring.position.copy(pos);
          ring.lookAt(pos.clone().multiplyScalar(2));

          markersGroup.add(dot);
          markersGroup.add(ring);
        });

        return markersGroup;
      }

      // ==========================================
      // 4. DỰNG MÔ HÌNH HÀNH TINH TỪ PLANET_CONFIG
      // ==========================================
      const sphereGeo = new THREE.SphereGeometry(RADIUS, 64, 64);
      const planetModels = {};
      const textureState = {
        earth: { status: 'loading', fileName: '' },
        moon: { status: 'loading', fileName: '' },
        mars: { status: 'loading', fileName: '' }
      };

      async function buildPlanet(key) {
        const cfg = PLANET_CONFIG[key];
        const group = new THREE.Group();

        // Placeholder ban đầu (hiện ngay nếu chưa có ảnh hoặc đang mở file://)
        const placeholderMat = new THREE.MeshStandardMaterial({
          color: cfg.placeholderColor,
          roughness: 0.85,
          metalness: 0.1,
          wireframe: true,
          transparent: true,
          opacity: 0.45
        });

        const surfaceMesh = new THREE.Mesh(sphereGeo, placeholderMat);
        surfaceMesh.name = 'surface';
        group.add(surfaceMesh);

        // Ghim tọa độ Analog gắn chặt lên surfaceMesh để xoay theo hành tinh
        const markersGroup = createAnalogMarkers(cfg);
        surfaceMesh.add(markersGroup);

        if (cfg.atmosphere) {
          group.add(createAtmosphereMesh(cfg.atmosphere.radius, cfg.atmosphere.color, cfg.atmosphere.intensity));
        }

        group.rotation.z = THREE.MathUtils.degToRad(cfg.tiltDeg);

        // Nạp ảnh thật từ assets/textures/
        const [colorMap, cloudMap, normalMap, bumpMap, specMap] = await Promise.all([
          loadFirstAvailable(cfg.textures.color, true),
          loadFirstAvailable(cfg.textures.clouds, false),
          loadFirstAvailable(cfg.textures.normal, false),
          loadFirstAvailable(cfg.textures.bump, false),
          loadFirstAvailable(cfg.textures.specular, false)
        ]);

        if (colorMap) {
          let realMat;
          if (cfg.materialType === 'phong') {
            const opts = {
              map: colorMap,
              specular: new THREE.Color(cfg.specular || 0x1e293b),
              shininess: cfg.shininess || 14
            };
            if (normalMap) {
              opts.normalMap = normalMap;
              opts.normalScale = new THREE.Vector2(0.85, 0.85);
            } else if (bumpMap) {
              opts.bumpMap = bumpMap;
              opts.bumpScale = 0.04;
            }
            if (specMap) {
              opts.specularMap = specMap;
              opts.shininess = 24;
            }
            realMat = new THREE.MeshPhongMaterial(opts);
          } else {
            realMat = new THREE.MeshStandardMaterial({
              map: colorMap,
              bumpMap: bumpMap || colorMap,
              bumpScale: bumpMap ? 0.045 : 0.022,
              roughness: cfg.roughness ?? 0.9,
              metalness: cfg.metalness ?? 0.02
            });
          }

          realMat.wireframe = isWireframe;
          surfaceMesh.material.dispose();
          surfaceMesh.material = realMat;

          if (cloudMap) {
            const isPng = cloudMap.userData.url.endsWith('.png');
            const cloudMat = isPng
              ? new THREE.MeshPhongMaterial({ map: cloudMap, transparent: true, opacity: 0.88, depthWrite: false })
              : new THREE.MeshPhongMaterial({ color: 0xffffff, alphaMap: cloudMap, transparent: true, opacity: 0.85, depthWrite: false });
            const cloudMesh = new THREE.Mesh(new THREE.SphereGeometry(RADIUS + 0.028, 64, 64), cloudMat);
            cloudMesh.name = 'clouds';
            group.add(cloudMesh);
          }

          const url = colorMap.userData && colorMap.userData.url ? colorMap.userData.url.split('/').pop() : '';
          textureState[key] = { status: 'real', fileName: url };
        } else {
          textureState[key] = { status: 'missing', fileName: cfg.textures.color[0] };
        }

        return group;
      }

      // ==========================================
      // 5. TƯƠNG TÁC UI, CHUYỂN Ô & XOAY TỚI TỌA ĐỘ
      // ==========================================
      let activePlanetKey = 'earth';
      let transitionProgress = 1;
      let isWireframe = false;
      let showMarkers = true;

      function updateInfoPanel(key) {
        const cfg = PLANET_CONFIG[key];
        document.documentElement.style.setProperty('--active-accent', cfg.accent);
        document.getElementById('info-tag').textContent = cfg.tag;
        document.getElementById('info-title').textContent = cfg.title;
        document.getElementById('info-desc').textContent = cfg.desc;

        document.getElementById('stats-grid').innerHTML = cfg.stats.map(s => `
          <div class="stat-item">
            <span class="stat-label">${s.label}</span>
            <span class="stat-value">${s.value}</span>
          </div>
        `).join('');

        document.getElementById('analogs-title').textContent = cfg.analogsTitle;
        const analogsList = document.getElementById('analogs-list');
        analogsList.innerHTML = cfg.analogs.map((site, idx) => `
          <button class="analog-item" data-index="${idx}" type="button">
            <div class="analog-name">
              <span>${site.name}</span>
              <span class="analog-coords">${site.lat.toFixed(1)}°, ${site.lon.toFixed(1)}°</span>
            </div>
            <div class="analog-note">${site.note}</div>
          </button>
        `).join('');

        analogsList.querySelectorAll('.analog-item').forEach(btn => {
          btn.addEventListener('click', () => {
            const idx = Number(btn.dataset.index);
            analogsList.querySelectorAll('.analog-item').forEach(b => b.classList.remove('selected'));
            btn.classList.add('selected');
            focusCameraOnLatLon(key, cfg.analogs[idx].lat, cfg.analogs[idx].lon);
          });
        });

        const st = textureState[key];
        const texStatusEl = document.getElementById('texture-status');
        if (st.status === 'real') {
          texStatusEl.className = 'texture-status real';
          texStatusEl.textContent = `✓ Đang dùng ảnh thật: ${st.fileName}`;
        } else if (st.status === 'loading') {
          texStatusEl.className = 'texture-status';
          texStatusEl.textContent = '⏳ Đang tải ảnh vệ tinh từ assets/textures/...';
        } else if (window.location.protocol === 'file:') {
          texStatusEl.className = 'texture-status fallback';
          texStatusEl.textContent = '⚠ Đang mở file://. Hãy chạy start_local.bat hoặc bấm nút bên dưới để chọn ảnh.';
        } else {
          texStatusEl.className = 'texture-status fallback';
          texStatusEl.textContent = `⚠ Chưa có ảnh (${cfg.textures.color.slice(0, 2).join(' hoặc ')}) trong assets/textures/.`;
        }
      }

      function focusCameraOnLatLon(key, lat, lon) {
        const group = planetModels[key];
        if (!group) return;
        const surface = group.getObjectByName('surface');
        if (!surface) return;

        // Tạm tắt tự xoay để người dùng nhìn rõ điểm vừa chọn
        controls.autoRotate = false;
        document.getElementById('btn-autorotate').classList.remove('active');

        surface.updateMatrixWorld(true);
        const worldPos = latLonToVector3(lat, lon, 1).applyMatrix4(surface.matrixWorld).normalize();
        const dist = camera.position.length() || 5.4;
        camera.position.copy(worldPos.multiplyScalar(dist));
        controls.target.set(0, 0, 0);
        controls.update();
      }

      function selectPlanet(key) {
        if (!PLANET_CONFIG[key]) return;
        activePlanetKey = key;

        document.querySelectorAll('.planet-card').forEach(btn => {
          btn.classList.toggle('active', btn.dataset.planet === key);
        });

        Object.entries(planetModels).forEach(([name, group]) => {
          group.visible = (name === key);
          if (name === key) group.scale.setScalar(0.58);
        });

        transitionProgress = 0;
        updateInfoPanel(key);
      }

      document.querySelectorAll('.planet-card').forEach(card => {
        card.addEventListener('click', () => selectPlanet(card.dataset.planet));
      });

      window.addEventListener('keydown', (e) => {
        if (e.key === '1') selectPlanet('earth');
        if (e.key === '2') selectPlanet('moon');
        if (e.key === '3') selectPlanet('mars');
      });

      const btnAutoRotate = document.getElementById('btn-autorotate');
      btnAutoRotate.addEventListener('click', () => {
        controls.autoRotate = !controls.autoRotate;
        btnAutoRotate.classList.toggle('active', controls.autoRotate);
      });

      const btnMarkers = document.getElementById('btn-markers');
      btnMarkers.addEventListener('click', () => {
        showMarkers = !showMarkers;
        btnMarkers.classList.toggle('active', showMarkers);
        Object.values(planetModels).forEach(group => {
          const surface = group.getObjectByName('surface');
          const m = surface && surface.getObjectByName('markers');
          if (m) m.visible = showMarkers;
        });
      });

      const btnWireframe = document.getElementById('btn-wireframe');
      btnWireframe.addEventListener('click', () => {
        isWireframe = !isWireframe;
        btnWireframe.classList.toggle('active', isWireframe);
        Object.entries(planetModels).forEach(([key, group]) => {
          const surface = group.getObjectByName('surface');
          if (surface && textureState[key].status === 'real') {
            surface.material.wireframe = isWireframe;
          }
        });
      });

      document.getElementById('btn-reset').addEventListener('click', () => {
        camera.position.set(0, 0.8, 5.4);
        controls.target.set(0, 0, 0);
        controls.update();
      });

      // Chọn ảnh trực tiếp từ máy (dùng khi mở file:// hoặc muốn đổi texture nhanh)
      const pickBtn = document.getElementById('btn-pick-texture');
      const fileInput = document.getElementById('local-texture-input');
      pickBtn.addEventListener('click', () => fileInput.click());
      fileInput.addEventListener('change', (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            const tex = new THREE.Texture(img);
            tex.encoding = THREE.sRGBEncoding;
            tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
            tex.needsUpdate = true;

            const group = planetModels[activePlanetKey];
            const cfg = PLANET_CONFIG[activePlanetKey];
            if (group) {
              const surface = group.getObjectByName('surface');
              if (surface) {
                surface.material.dispose();
                surface.material = cfg.materialType === 'phong'
                  ? new THREE.MeshPhongMaterial({ map: tex, specular: new THREE.Color(0x1e293b), shininess: 14, wireframe: isWireframe })
                  : new THREE.MeshStandardMaterial({ map: tex, bumpMap: tex, bumpScale: 0.022, roughness: cfg.roughness ?? 0.9, metalness: 0.02, wireframe: isWireframe });
              }
              textureState[activePlanetKey] = { status: 'real', fileName: file.name };
              updateInfoPanel(activePlanetKey);
            }
          };
          img.src = reader.result;
        };
        reader.readAsDataURL(file);
        fileInput.value = '';
      });

      // Tooltip khi di chuột qua các ghim 3D
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      const tooltip = document.getElementById('marker-tooltip');

      renderer.domElement.addEventListener('pointermove', (e) => {
        const activeGroup = planetModels[activePlanetKey];
        if (!activeGroup || !showMarkers) {
          tooltip.style.display = 'none';
          return;
        }
        const surface = activeGroup.getObjectByName('surface');
        const markers = surface && surface.getObjectByName('markers');
        if (!markers) return;

        pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);

        const hits = raycaster.intersectObjects(markers.children, false);
        const hitWithSite = hits.find(h => h.object.userData && h.object.userData.site);
        const surfaceHits = raycaster.intersectObject(surface, false);
        const isFrontSide = !surfaceHits.length || (hitWithSite && hitWithSite.distance <= surfaceHits[0].distance + 0.04);
        if (hitWithSite && isFrontSide) {
          const site = hitWithSite.object.userData.site;
          tooltip.style.display = 'block';
          tooltip.style.left = (e.clientX + 14) + 'px';
          tooltip.style.top = (e.clientY + 14) + 'px';
          tooltip.innerHTML = `<strong>${site.name}</strong><br><span style="color:#94a3b8">${site.note}</span>`;
          renderer.domElement.style.cursor = 'pointer';
        } else {
          tooltip.style.display = 'none';
          renderer.domElement.style.cursor = 'grab';
        }
      });

      // ==========================================
      // 6. KHỞI TẠO & VÒNG LẶP RENDER
      // ==========================================
      (async function init() {
        try {
          // Tải Trái Đất trước để hiện ngay, sau đó tải tiếp Mặt Trăng & Sao Hỏa (ảnh 8K)
          planetModels.earth = await buildPlanet('earth');
          planetModels.earth.visible = false;
          scene.add(planetModels.earth);

          selectPlanet('earth');
          overlay.classList.add('hidden');

          const [moon, mars] = await Promise.all([
            buildPlanet('moon'),
            buildPlanet('mars')
          ]);
          planetModels.moon = moon;
          planetModels.mars = mars;
          [moon, mars].forEach(m => {
            m.visible = (activePlanetKey === (m === moon ? 'moon' : 'mars'));
            const surface = m.getObjectByName('surface');
            const markers = surface && surface.getObjectByName('markers');
            if (markers) markers.visible = showMarkers;
            scene.add(m);
          });
          updateInfoPanel(activePlanetKey);
        } catch (err) {
          statusText.textContent = 'Lỗi khởi tạo mô hình 3D: ' + (err && err.message ? err.message : err);
        }
      })();

      const clock = new THREE.Clock();

      function animate() {
        requestAnimationFrame(animate);
        const dt = clock.getDelta();

        if (transitionProgress < 1 && planetModels[activePlanetKey]) {
          transitionProgress = Math.min(1, transitionProgress + dt * 3.2);
          const ease = 1 - Math.pow(1 - transitionProgress, 3);
          planetModels[activePlanetKey].scale.setScalar(0.58 + 0.42 * ease);
        }

        if (planetModels.earth && planetModels.earth.visible) {
          const clouds = planetModels.earth.getObjectByName('clouds');
          if (clouds) clouds.rotation.y += dt * 0.055;
        }

        const starField = scene.getObjectByName('starfield');
        if (starField) starField.rotation.y += dt * 0.005;

        controls.update();
        renderer.render(scene, camera);
      }

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      animate();
    })();
  </script>
</body>
</html>
